name: CI

# Runs on every push to main and on pull requests. release.yml also calls it
# (workflow_call) so nothing is published unless these checks pass.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  addon:
    name: Addon tests (Lua ${{ matrix.lua }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lua: ["5.1", "5.4"]   # 5.1 is what the game runs
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}
      - name: Syntax check
        run: |
          for f in $(grep -E '\.lua$' ForeverChronicler.toc | tr -d '\r') tests/*.lua; do
            luac -p "$f"
          done
      - name: XML is well-formed
        run: python3 -c "import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]" $(grep -E '\.xml$' ForeverChronicler.toc | tr -d '\r')
      - name: Tests
        run: lua tests/run.lua .
      - name: Package builds
        run: scripts/package.sh

  companion:
    name: Companion tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the addon zip (the installer tests check it)
        if: runner.os == 'Linux'
        run: scripts/package.sh
      - name: Companion tests
        run: python -m unittest discover -s companion/tests -v
