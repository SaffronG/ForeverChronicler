name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lua: ["5.1", "5.4"]   # 5.1 is what the game runs
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}
      - name: Syntax check
        run: |
          for f in $(grep -E '\.lua$' ForeverChronicaller.toc | tr -d '\r') tests/*.lua; do
            luac -p "$f"
          done
      - name: XML is well-formed
        run: python3 -c "import sys, xml.etree.ElementTree as ET; [ET.parse(f) for f in sys.argv[1:]]" *.xml
      - name: Tests
        run: lua tests/run.lua .
      - name: Package builds
        run: scripts/package.sh

  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"   # oldest supported
      - name: Companion tests
        run: python -m unittest discover -s companion/tests -v

  release:
    needs: [test, companion]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the .toc version
        run: |
          V=$(sed -n 's/^## Version: *//p' ForeverChronicaller.toc | tr -d '\r')
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match .toc version $V" >&2
            exit 1
          fi
      - name: Package
        run: scripts/package.sh
      - name: Release notes
        run: scripts/release_notes.sh > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release-notes.md
